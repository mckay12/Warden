[package]
name = "warden-service"
version = "0.2.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["rustls"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Services", "Win32_System_Registry", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }
